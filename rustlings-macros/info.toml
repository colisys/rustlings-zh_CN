format_version = 1

welcome_message = """
第一次接触 Rust 语言？别紧张，Rustlings 就是为了初学者而生的！
我们会不遗余力的帮助您开启 Rust 之旅，在开始之前，阐述一下我们的目标：

1. 解答 exercises 目录下面的谜题。这些谜题中存在一些编译器或逻辑错误，
   你需要修复这些错误，使得编译和测试用例都通过。

2. 在本项目的根目录下启动 Rustlings，会展示您的解谜进度；当您完成一个
   谜题并且保存文件之后，Rustlings 会自动编译它，并且运行测试用例，如果
   出现了任何的编译错误或测试用例没有通过，我们会提示你进行修复。

3. 如果你被某个谜题卡住了，可以按 `h` 显示提示。

4. 如果你觉得某个谜题不合常理，可以在 GitHub 中随时反馈一个 issue！
   我们会查看每个 issue，你的疑惑有时候可以帮到别的学习者！
"""

final_message = """
我们希望你能享受 Rust 语言的方方面面，如果你注意到有什么问题，
无需犹豫，请通过 GitHub 向我们反馈。

你也可以将自己的谜题贡献给我们，壮大社区！

不过，在你决定要反馈或是贡献之前，请参阅我们的指南：
**https://github.com/rust-lang/rustlings/blob/main/CONTRIBUTING.md**
"""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
按 `n` 键切换到下一个谜题。
如果没反应，再按一下回车键试试。"""

[[exercises]]
name = "intro2"
dir = "00_intro"
test = false
hint = """
编译器提示我们用于打印的宏的名字出现了问题，同时给出了修复建议。"""

# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
`main` 函数中，变量绑定的语句中缺少关键词。

它的写法可以参照[变量和可变性](https://kaisery.github.io/trpl-zh-cn/ch03-01-variables-and-mutability.html)。"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
编译器信息显示，Rust 不能推断被绑定到变量 `x` 上的值是什么类型。

可以做如下的尝试：

1. 给 `x` 显式标注类型
2. 给 `x` 赋值
3. 既给 `x` 显式标注类型，又赋值
4. 给 `x` 标注别的可能的类型"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
我们尝试使用一个未初始化的变量。

我们不可能把一个不存在的东西打印出来，试试给变量 `x` 绑定一个值！

在其他语言中可能很容易犯这种小错误（比如一些动态类型语言），还好我们有 Rust 编译器能够捕获这种错误！"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = "Rust 默认变量不可变。但这里我们需要修改 `x` 的值，试试加上某个关键字？"

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
想给现有变量赋不同类型的值？试试变量遮蔽（Shadowing）！
详见：https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing"""

[[exercises]]
name = "variables6"
dir = "01_variables"
test = false
hint = """
常量总是不可变的，用 `const` 声明，类型必须显式标注。
详见：https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
test = false
hint = """
`main` 调用了一个不存在的函数 `call_me`，试试定义它。参数和返回值参考 `main` 的写法。"""

[[exercises]]
name = "functions2"
dir = "02_functions"
test = false
hint = """
函数参数需要类型标注，`call_me` 的 `num` 缺少类型。"""

[[exercises]]
name = "functions3"
dir = "02_functions"
test = false
hint = """
这次函数定义没问题，问题出在调用处。"""

[[exercises]]
name = "functions4"
dir = "02_functions"
test = false
hint = """
编译器提示 `sale_price` 函数的返回值类型缺失，在 `->` 后添加返回类型。
参考 `is_even` 函数的写法。"""

[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """
Rust 区分表达式和语句：表达式返回值，语句返回 `()`（类似 C/C++ 的 void）。

`square` 应返回 `i32`，但实际返回了 `()`。两种解法：
1. 在 `num * num;` 前加 `return`
2. 删除 `num * num` 后的分号 `;`"""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
一行搞定！类似其他语言的三元表达式：
- C/C++: `a > b ? a : b`
- Python: `a if a > b else b`

Rust 的 `if`/`else` 是表达式，条件不需要括号，分支必须用 `{}` 包裹。"""

[[exercises]]
name = "if2"
dir = "03_if"
hint = "Rust 要求每个条件分支返回相同类型。阅读测试用例，了解预期行为。"

[[exercises]]
name = "if3"
dir = "03_if"
hint = "Rust 要求 `if` 表达式的每个分支返回相同类型的值。"

