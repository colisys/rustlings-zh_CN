# THREADS

[[exercises]]
name = "threads1"
dir = "20_threads"
test = false
hint = """
`JoinHandle` 是 `spawn` 返回的结构体：https://doc.rust-lang.org/std/thread/fn.spawn.html

多线程的挑战：主线程可能在子线程完成前结束。
参考：https://doc.rust-lang.org/book/ch16-01-threads.html#waiting-for-all-threads-to-finish-using-join-handles

用 `JoinHandle` 等待每个线程完成并收集结果。
https://doc.rust-lang.org/std/thread/struct.JoinHandle.html"""

[[exercises]]
name = "threads2"
dir = "20_threads"
test = false
hint = """
`Arc` 是原子引用计数指针，允许多线程共享不可变数据。但我们要修改 `jobs_done`，所以需要另一种类型来确保同一时间只有一个线程能修改数据。

参考：https://doc.rust-lang.org/book/ch16-03-shared-state.html#atomic-reference-counting-with-arct

需要 `Arc<Mutex<JobStatus>>` 吗？像这样：
```
let status = Arc::new(Mutex::new(JobStatus { jobs_done: 0 }));
```

参考示例：https://doc.rust-lang.org/book/ch16-03-shared-state.html#sharing-a-mutext-between-multiple-threads"""

[[exercises]]
name = "threads3"
dir = "20_threads"
hint = """
可以用 `mpsc`（多生产者单消费者）通道实现线程间通信。一端发送，另一端接收。
用 `clone()` 可以创建多个生产者。

参考：https://doc.rust-lang.org/book/ch16-02-message-passing.html"""

