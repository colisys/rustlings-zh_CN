# MOVE SEMANTICS

[[exercises]]
name = "move_semantics1"
dir = "06_move_semantics"
hint = """
编译错误说无法可变借用 `vec`，因为它没有声明为可变。
添加一个关键字即可——但不是在 `push` 那一行。

试试在调用 `fill_vec()` 后访问 `vec0`，看看会发生什么？"""

[[exercises]]
name = "move_semantics2"
dir = "06_move_semantics"
hint = """
错误是"移动后值的借用"。当参数传入函数且未显式返回时，原变量就无法再使用了——这叫"移动"。

可以克隆 `vec0` 的数据传给 `fill_vec`，这叫 `clone`。"""

[[exercises]]
name = "move_semantics3"
dir = "06_move_semantics"
hint = """
这次 `fill_vec` 第一行的 `let mut vec = vec;` 被删掉了。
你可以在某个地方加 `mut`，让已有绑定变成可变的。"""

[[exercises]]
name = "move_semantics4"
dir = "06_move_semantics"
hint = """
仔细思考可变引用的作用范围。在获取可变引用后立即更新 `x` 有帮助吗？
参考书中"可变引用"章节：
https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references"""

[[exercises]]
name = "move_semantics5"
dir = "06_move_semantics"
test = false
hint = """
参考书中"引用与借用"章节：https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html

第一个问题：`get_char` 获取了字符串所有权，导致 `data` 被移动，`string_uppercase` 无法使用。
第二个问题：修复后，`string_uppercase` 的函数签名也需要调整。"""

