# STANDARD LIBRARY TYPES

[[exercises]]
name = "iterators1"
dir = "18_iterators"
hint = """
迭代器遍历集合中的所有元素，但遍历完后会怎样？
参考：https://doc.rust-lang.org/std/iter/trait.Iterator.html"""

[[exercises]]
name = "iterators2"
dir = "18_iterators"
hint = """
`capitalize_first`：
- `first` 是 `char`，需要大写后与 `chars` 中剩余字符组合返回 `String`
- 剩余字符可用 `as_str` 方法转为字符串切片
- `char` 有很多有用方法：https://doc.rust-lang.org/std/primitive.char.html
- 用 `char::to_uppercase`，它返回可转为 `String` 的迭代器

`capitalize_words_vector`：
- 从切片创建迭代器，用 `capitalize_first` 转换，然后 `collect`

`capitalize_words_string`：
- 与前一解法类似，`collect` 很强大，Rust 会根据目标类型自动推断"""

[[exercises]]
name = "iterators3"
dir = "18_iterators"
hint = """
`divide`：除数为 0 或不能整除时返回正确错误。

`division_results`：需要收集为某种集合类型。

`result_with_list`：返回单个 `Result`，成功时是整数向量，失败时是 `DivisionError`。

`list_of_results`：返回结果向量。

参考 `FromIterator` trait 在 `collect()` 中的应用：
https://doc.rust-lang.org/std/iter/trait.Iterator.html#method.collect
这个 trait 非常强大！"""

[[exercises]]
name = "iterators4"
dir = "18_iterators"
hint = """
命令式语言可能用 `for` 循环更新可变变量，或用递归和 match。Rust 有更优雅的函数式方法：用范围和迭代器计算阶乘。

看看 `fold` 和 `rfold` 方法！"""

[[exercises]]
name = "iterators5"
dir = "18_iterators"
hint = """
参考 `std::iter::Iterator` trait 文档，有很多有用的方法。

`count_collection_iterator` 中的 `collection` 是 `HashMap` 切片，需要转为迭代器才能使用迭代器方法。

`fold` 方法在 `count_collection_iterator` 中很有用。

进阶挑战：查阅文档找到一个比 `fold` 更简洁的方法。"""

