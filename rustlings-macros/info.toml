# ERROR HANDLING

[[exercises]]
name = "errors1"
dir = "13_error_handling"
hint = """
`Ok` 和 `Err` 是 `Result` 的两个变体。测试期望 `generate_nametag_text` 返回 `Result` 而非 `Option`。

需要：
- 返回类型改为 `Result<String, String>`
- `Some(...)` 改为 `Ok(...)`
- `None` 改为 `Err(错误信息)`"""

[[exercises]]
name = "errors2"
dir = "13_error_handling"
hint = """
可以用 `match` 处理 `item_quantity.parse::<i32>()`，匹配 `Ok(...)` 和 `Err(...)`。

但这种模式很常见，所以 Rust 提供了 `?` 运算符！

详见：https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator"""

[[exercises]]
name = "errors3"
dir = "13_error_handling"
test = false
hint = """
其他函数可以返回 `Result`，`main` 也可以！惯例是返回 `Result<(), ErrorType>`。
`()` 表示成功时不需要返回有意义的内容。"""

[[exercises]]
name = "errors4"
dir = "13_error_handling"
hint = """
`PositiveNonzeroInteger::new` 目前总是返回 `Ok`。应该先检查，失败时返回 `Err`，成功才返回 `Ok`。"""

[[exercises]]
name = "errors5"
dir = "13_error_handling"
test = false
hint = """
`main` 函数中有两种不同的 `Result` 通过 `?` 传播。如何声明返回类型？

`?` 运算符底层调用 `From::from` 将错误转为 `Box<dyn Error>`，这个装箱的 trait 对象可以捕获多种错误类型。

详见：
- https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator
- https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/boxing_errors.html
- https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html"""

[[exercises]]
name = "errors6"
dir = "13_error_handling"
hint = """
`TODO` 下方有 `map_err()` 的示例，用于将一种错误转换为另一种。
对 `parse()` 的 `Result` 做类似处理，然后用 `?` 提前返回。

详见：https://doc.rust-lang.org/std/result/enum.Result.html#method.map_err"""

